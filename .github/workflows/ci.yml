name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.4.1
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root

    # Os passos de verificacao abaixo levam `if: always()`. Sem isso o job para
    # no primeiro que sai com codigo 1, e como o Ruff e o primeiro da fila, um
    # unico apontamento de lint fazia o Bandit, o Mypy e o PYTEST serem PULADOS
    # — o PR ficava vermelho sem que ninguem soubesse se os testes passam.
    #
    # Isso nao e hipotetico: a `dev` tem 223 apontamentos de Ruff e 73 de Mypy,
    # herdados de antes do CI existir e espalhados por arquivos dos tres grupos.
    # Enquanto essa divida nao for quitada, TODO PR morre no passo 1 e a suite
    # nunca roda. Com `always()` os quatro checks reportam de forma
    # independente: da para ver que os testes passam ao mesmo tempo em que
    # Ruff e Mypy acusam a divida pendente.
    #
    # Nenhum gate foi enfraquecido: cada passo continua saindo com codigo 1 no
    # seu proprio criterio e o job so fica verde quando os quatro passarem.
    # `always()` muda apenas QUANDO o passo roda, nunca se ele aprova.
    - name: Run Ruff (Linter)
      run: poetry run ruff check src/

    # -c pyproject.toml: o Bandit NAO le o pyproject sozinho. Sem esta flag a
    #   secao [tool.bandit] e ignorada e os 835 asserts da suite voltam.
    # -ll: falha em MEDIUM e HIGH, nao em LOW. Sem isso qualquer alerta de
    #   severidade baixa deixa o passo vermelho, e um check que sempre falha e
    #   um check que ninguem le. Verificado que um B310 (MEDIUM) continua
    #   bloqueando com este limiar.
    - name: Run Bandit (Security gate — MEDIUM+)
      if: always()
      run: poetry run bandit -c pyproject.toml -r src/ -ll

    # Relatorio completo, incluindo LOW, para ficar visivel no log sem travar
    # o merge. Hoje sao 8 alertas LOW conhecidos (B105 em observability/
    # adk_bridge.py, B110 em observability/tracer.py e validacao_retry.py).
    - name: Bandit full report (informational)
      if: always()
      run: poetry run bandit -c pyproject.toml -r src/ || true

    - name: Run Mypy (Type Checking)
      if: always()
      run: poetry run mypy src/

    - name: Run Pytest (Tests)
      if: always()
      run: poetry run pytest
